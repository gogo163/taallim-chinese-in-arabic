<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>اختبار الوقت — اختار المستوى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FBF6EA; --ink-2:#FFFFFF; --paper:#241F16;
    --seal:#B23A2E; --seal-dark:#8C2C22; --gold:#A8792B; --gold-light:#D9B774; --jade:#2F4F47;
    --text-soft:#5C5240; --text-dim:#7A7260; --locked:#C9C0AC;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    background:var(--ink); color:var(--paper); font-family:'Tajawal',sans-serif;
    max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:40px;
  }
  a{ text-decoration:none; color:inherit; }
  h1{ font-family:'Amiri',serif; }
  .zh{ font-family:'Noto Serif SC',serif; }

  header.top{
    position:sticky; top:0; z-index:20; background:rgba(251,246,234,0.96); backdrop-filter:blur(10px);
    padding:14px 18px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid rgba(150,110,40,0.15);
  }
  .back-btn{ background:none; border:none; font-size:20px; color:var(--paper); cursor:pointer; }
  header.top strong{ font-family:'Amiri',serif; font-size:1.05rem; }

  .hero{ padding:22px 20px 6px; }
  .hero .eyebrow{ color:var(--gold); font-size:0.78rem; font-weight:800; letter-spacing:1px; margin-bottom:6px; }
  .hero h1{ font-size:1.4rem; margin-bottom:6px; }
  .hero p{ color:var(--text-soft); font-size:0.85rem; }

  .level-list{ padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
  .level-card{
    background:var(--ink-2); border:1px solid rgba(150,110,40,0.2); border-radius:18px;
    padding:18px; display:flex; align-items:center; gap:16px;
    box-shadow:0 8px 20px rgba(36,31,22,0.06);
  }
  .level-card.locked{ opacity:0.6; }
  .level-icon{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif SC',serif; font-size:1.5rem; color:var(--ink);
  }
  .level-icon.hsk1{ background:var(--seal); }
  .level-icon.hsk2{ background:var(--seal-dark); }
  .level-icon.hsk3{ background:#8B5E34; }
  .level-icon.locked{ background:var(--locked); }

  .level-info{ flex:1; }
  .level-info b{ display:block; font-size:1rem; margin-bottom:3px; }
  .level-info span{ font-size:0.78rem; color:var(--text-dim); }
  .level-go{
    font-size:0.8rem; font-weight:800; color:var(--seal); white-space:nowrap;
  }
  .level-go.locked{ color:var(--text-dim); }

  footer.note{ text-align:center; color:var(--text-dim); font-size:0.78rem; margin-top:20px; padding:0 30px; }
</style>
</head>
<body>

<header class="top">
  <button class="back-btn" onclick="location.href='index.html'">→</button>
  <strong>اختبار الوقت ⏱️</strong>
</header>

<div class="hero">
  <div class="eyebrow">سباق مع الوقت</div>
  <h1>اختار المستوى</h1>
  <p>اختبار سريع على كلمات المستوى اللي وصلتله، فيه أسئلة كتابة وأسئلة سماع.</p>
</div>

<div class="level-list" id="levelList"></div>

<footer class="note">تعلّم 中文 — صُنع بشغف من مصر</footer>

<script src="progress.js"></script>
<script>
  const state = TaallimProgress.loadProgress();
  const LEVELS = [
    { num: 1, label: 'HSK1', icon: '路', title: 'اختبار HSK1' },
    { num: 2, label: 'HSK2', icon: '进', title: 'اختبار HSK2' },
    { num: 3, label: 'HSK3', icon: '升', title: 'اختبار HSK3' }
  ];

  const list = document.getElementById('levelList');
  LEVELS.forEach(lvl => {
    const done = state.lastCompletedByLevel[lvl.label] || 0;
    const unlocked = done > 0;

    const card = document.createElement(unlocked ? 'a' : 'div');
    card.className = 'level-card' + (unlocked ? '' : ' locked');
    if (unlocked) card.href = `quiz.html?level=${lvl.num}`;

    card.innerHTML = `
      <div class="level-icon ${unlocked ? 'hsk' + lvl.num : 'locked'} zh">${unlocked ? lvl.icon : '🔒'}</div>
      <div class="level-info">
        <b>${lvl.title}</b>
        <span>${unlocked ? `${done} درس مكتمل — جاهز للاختبار` : 'كمّل أول درس في المستوى ده الأول'}</span>
      </div>
      <div class="level-go ${unlocked ? '' : 'locked'}">${unlocked ? 'ابدأ ←' : 'مقفول'}</div>
    `;
    list.appendChild(card);
  });
</script>

</body>
</html>
