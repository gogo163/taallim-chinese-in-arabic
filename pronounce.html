<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تعلّم 中文 — تجربة النطق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FBF6EA; --ink-2:#FFFFFF; --paper:#241F16;
    --seal:#B23A2E; --gold:#A8792B; --jade:#2F4F47;
    --text-soft:#5C5240; --text-dim:#7A7260;
    --ok:#2F6F5E; --warn:#A8792B; --bad:#B23A2E;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ background:var(--ink); color:var(--paper); font-family:'Tajawal',sans-serif; max-width:480px; margin:0 auto; min-height:100vh; }
  a{ text-decoration:none; color:inherit; }
  .zh{ font-family:'Noto Serif SC',serif; }

  .top{ position:sticky; top:0; z-index:10; background:rgba(251,246,234,0.96); backdrop-filter:blur(10px);
        padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
        border-bottom:1px solid rgba(150,110,40,0.15); }
  .top a{ font-weight:800; font-size:0.9rem; color:var(--seal); }
  .top b{ font-family:'Amiri',serif; font-size:1.05rem; }
  #counter{ font-size:0.82rem; color:var(--text-dim); font-weight:700; min-width:48px; text-align:left; }

  main{ padding:22px 20px 40px; }
  .intro{ font-size:0.85rem; color:var(--text-soft); text-align:center; margin-bottom:18px; line-height:1.8; }

  .card{ background:var(--ink-2); border:1px solid rgba(150,110,40,0.25); border-radius:20px;
         padding:28px 18px 24px; text-align:center; box-shadow:0 10px 26px rgba(36,31,22,0.08); }
  #hanzi{ font-size:4.2rem; line-height:1.25; direction:ltr; }
  #pinyin{ font-size:1.15rem; font-weight:800; color:var(--seal); margin-top:6px; direction:ltr; }
  #pyar{ font-size:1rem; margin-top:8px; }
  #meaning{ font-size:0.9rem; color:var(--text-soft); margin-top:4px; font-weight:700; }

  .row{ display:flex; gap:10px; justify-content:center; margin-top:24px; }
  button{ font-family:inherit; font-weight:800; border:none; border-radius:999px; padding:12px 20px; font-size:0.9rem; cursor:pointer; }
  button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  #listen{ background:var(--ink-2); color:var(--seal); border:1.5px solid rgba(178,58,46,0.35); }
  #mic{ background:var(--seal); color:var(--ink); min-width:140px; }
  #mic[disabled]{ opacity:.65; }
  #mic.on{ animation:pulse 1.1s infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 10px rgba(178,58,46,0.2); } }
  @media (prefers-reduced-motion: reduce){ #mic.on{ animation:none; } }

  #result{ margin-top:20px; min-height:58px; font-size:1rem; font-weight:800; }
  #result .heard{ font-weight:500; font-size:0.8rem; color:var(--text-dim); margin-top:4px; direction:ltr; }
  .ok{ color:var(--ok); } .warn{ color:var(--warn); } .bad{ color:var(--bad); }
  #next{ display:none; margin-top:12px; background:var(--paper); color:var(--ink); }
  #score{ margin-top:14px; font-size:0.8rem; color:var(--text-dim); }

  #done{ display:none; text-align:center; padding:30px 10px; }
  #done h2{ font-family:'Amiri',serif; font-size:1.4rem; margin-bottom:8px; }
  #done p{ color:var(--text-soft); font-size:0.9rem; margin-bottom:18px; }
  #done a, #done button{ display:inline-block; background:var(--seal); color:var(--ink); padding:12px 22px; border-radius:999px; font-weight:800; }
</style>
</head>
<body>

<div class="top">
  <a href="index.html">→ الرئيسية</a>
  <b>تجربة النطق</b>
  <span id="counter"></span>
</div>

<main>
  <p class="intro" id="intro">اسمع الكلمة، وبعدين دوس 🎤 وانطقها. هقولك لو نطقتها صح.</p>

  <section class="card" id="card" aria-live="polite">
    <div id="hanzi" class="zh"></div>
    <div id="pinyin"></div>
    <div id="pyar"></div>
    <div id="meaning"></div>

    <div class="row">
      <button id="listen" type="button">🔊 اسمع الأول</button>
      <button id="mic" type="button">🎤 انطق</button>
    </div>

    <div id="result"></div>
    <button id="next" type="button">الكلمة اللي بعدها</button>
    <div id="score"></div>
  </section>

  <section id="done">
    <h2>خلصت الجلسة 🎉</h2>
    <p id="doneMsg"></p>
    <button id="again" type="button">جلسة جديدة</button>
  </section>
</main>

<script src="hsk1-data.js"></script>
<script src="progress.js"></script>
<script>
/* ===== 1) تجهيز الكلمات من داتا HSK1 (الدروس اللي خلصتها أولاً) ===== */
const SESSION_SIZE = 10;
const FALLBACK_WORDS = [
  { hanzi:"你好", pinyin:"nǐ hǎo", pinyin_ar:"ني هاو", meaning_ar:"مرحبا" },
  { hanzi:"谢谢", pinyin:"xièxie", pinyin_ar:"شيه شيه", meaning_ar:"شكرا" },
  { hanzi:"再见", pinyin:"zàijiàn", pinyin_ar:"تساي جيان", meaning_ar:"إلى اللقاء" }
];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// بيدعم صيغتين للداتا: {hanzi, meaning_ar} (HSK3/4) و {char, ar} (HSK1/2)
function normWord(w, lessonId, i){
  const hanzi = w.hanzi !== undefined ? w.hanzi : w.char;
  if(!hanzi) return null;
  return {
    hanzi: hanzi,
    pinyin: w.pinyin || "",
    pinyin_ar: w.pinyin_ar || "",
    meaning_ar: w.meaning_ar !== undefined ? w.meaning_ar : (w.ar || ""),
    audio: w.audio ? w.audio : `audio/hsk1/l${lessonId}-${i+1}.wav`
  };
}

function buildPool(){
  if(typeof HSK1_LESSONS === 'undefined') return FALLBACK_WORDS.slice();
  let st = null;
  try{ st = TaallimProgress.loadProgress(); }catch(e){}
  const done = new Set((st && st.completedLessons || []).filter(k => k.startsWith('HSK1-')).map(k => parseInt(k.split('-')[1],10)));
  let pool = [], all = [];
  HSK1_LESSONS.forEach(lesson => {
    (lesson.words || []).forEach((w, i) => {
      const n = normWord(w, lesson.id, i);
      if(!n) return;
      all.push(n);
      if(done.has(lesson.id)) pool.push(n);   // الدروس اللي خلصها اليوزر
    });
  });
  if(!pool.length) pool = all;                // لو ما خلصش أي درس: كل كلمات HSK1
  return pool.length ? pool : FALLBACK_WORDS.slice();
}

/* ===== 2) المقارنة ===== */
const DIGITS = {"0":"零","1":"一","2":"二","3":"三","4":"四","5":"五","6":"六","7":"七","8":"八","9":"九"};
function normalize(s){
  return String(s||"").replace(/[0-9]/g, d => DIGITS[d]).replace(/[^\u4e00-\u9fff]/g, "");
}
function similarity(a, b){
  if(!a || !b) return 0;
  const m=a.length, n=b.length, dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return 1 - dp[m][n]/Math.max(m,n);
}
// بعض كلمات HSK1 فيها بدائل بالشكل "什么 / 甚么"
function variants(w){ return String(w.hanzi).split(' / ').map(normalize).filter(Boolean); }

/* ===== 3) الحالة ===== */
let queue = [], idx = 0, listening = false, timer = null, correctCount = 0, tried = 0, awarded = false;
const $ = id => document.getElementById(id);

function startSession(){
  queue = shuffle(buildPool()).slice(0, SESSION_SIZE);
  idx = 0; correctCount = 0; tried = 0;
  $("done").style.display = "none"; $("card").style.display = "block"; $("intro").style.display = "block";
  show();
}
function show(){
  const w = queue[idx];
  awarded = false;
  $("hanzi").textContent = String(w.hanzi).split(' / ')[0];
  $("pinyin").textContent = w.pinyin || "";
  $("pyar").textContent = w.pinyin_ar || "";
  $("meaning").textContent = w.meaning_ar || "";
  $("counter").textContent = (idx+1) + " / " + queue.length;
  $("result").innerHTML = "";
  $("next").style.display = "none";
  $("score").textContent = tried ? ("نطقت صح " + correctCount + " من " + tried) : "";
  setListening(false);
}
function setListening(on){
  listening = on; const b = $("mic");
  b.disabled = on; b.classList.toggle("on", on);
  b.textContent = on ? "بسمعك..." : "🎤 انطق";
}

/* ===== 4) سماع الكلمة (ملف صوت، وإلا صوت الجهاز) ===== */
function speakFallback(text){
  if(window.AppInventor && window.AppInventor.setWebViewString){ window.AppInventor.setWebViewString('SPEAK_ZH::' + text); return; }
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
}
$("listen").onclick = () => {
  const w = queue[idx], ch = String(w.hanzi).split(' / ')[0];
  if(!w.audio){ speakFallback(ch); return; }
  const a = new Audio(w.audio); let handled = false;
  a.addEventListener('error', () => { if(!handled){ handled = true; speakFallback(ch); } });
  a.play().catch(() => { if(!handled){ handled = true; speakFallback(ch); } });
};

/* ===== 5) التسجيل ===== */
$("mic").onclick = () => {
  if(listening) return;
  setListening(true); $("result").innerHTML = "";
  clearTimeout(timer); timer = setTimeout(() => onSpeechError("timeout"), 15000);
  const target = String(queue[idx].hanzi).split(' / ')[0];

  if(window.AppInventor && window.AppInventor.setWebViewString){
    window.AppInventor.setWebViewString("LISTEN_ZH::" + target);   // كودولار بيرد عن طريق onSpeechResult
  } else if(window.SpeechRecognition || window.webkitSpeechRecognition){   // للتجربة على كروم بس
    const R = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    R.lang = "zh-CN"; R.maxAlternatives = 3;
    R.onresult = e => onSpeechResult(Array.from(e.results[0]).map(a => a.transcript).join("|"));
    R.onerror = () => onSpeechError("error");
    R.start();
  } else { onSpeechError("unsupported"); }
};

/* ===== 6) كودولار بيرجّع النتيجة هنا ===== */
window.onSpeechResult = function(text){
  clearTimeout(timer); setListening(false);
  const targets = variants(queue[idx]);
  const heardList = String(text||"").split("|").map(normalize).filter(Boolean);
  let best = 0;
  heardList.forEach(h => targets.forEach(t => { best = Math.max(best, similarity(h, t)); }));
  tried++;
  let html;
  if(best >= 0.99){
    correctCount++; awardPoints();
    html = '<div class="ok">✅ نطق ممتاز!</div>';
  } else if(best >= 0.5){
    html = '<div class="warn">👍 قريب، جرب تاني</div>';
  } else {
    html = '<div class="bad">❌ لسه، اسمع الكلمة وجرب تاني</div>';
  }
  html += '<div class="heard">سمعتك بتقول: ' + (heardList[0] || "—") + '</div>';
  $("result").innerHTML = html;
  $("score").textContent = "نطقت صح " + correctCount + " من " + tried;
  $("next").style.display = "inline-block";
};
window.onSpeechError = function(kind){
  clearTimeout(timer); setListening(false);
  const msg = {
    timeout:"ماسمعتش حاجة، جرب تاني وقرّب الموبايل منك.",
    unsupported:"النطق مش مدعوم هنا. جربه من داخل التطبيق.",
    error:"حصل خطأ في التسجيل. اتأكد من إذن الميكروفون والنت.",
    denied:"إذن الميكروفون مرفوض. فعّله من إعدادات التطبيق في الموبايل وجرب تاني."
  }[kind] || "حصل خطأ، جرب تاني.";
  $("result").innerHTML = '<div class="bad">' + msg + '</div>';
  $("next").style.display = "inline-block";
};

/* ===== 7) النقاط (مرة لكل كلمة في الجلسة) ===== */
function awardPoints(){
  if(awarded) return; awarded = true;
  try{
    const st = TaallimProgress.loadProgress();
    const pts = (typeof POINTS_TABLE !== 'undefined' && POINTS_TABLE.quizCorrectAnswer) ? POINTS_TABLE.quizCorrectAnswer : 2;
    st.points = (st.points || 0) + pts;
    TaallimProgress.saveProgress(st);
  }catch(e){}
}

$("next").onclick = () => {
  idx++;
  if(idx >= queue.length){
    $("card").style.display = "none"; $("intro").style.display = "none";
    $("done").style.display = "block";
    $("doneMsg").textContent = "نطقت صح " + correctCount + " من " + tried + " محاولة.";
  } else show();
};
$("again").onclick = startSession;

startSession();
</script>
</body>
</html>
