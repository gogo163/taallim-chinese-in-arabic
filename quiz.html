<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اختبار الوقت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --seal:#B23A2E;
    --seal-dark:#8C2C22;
    --gold:#A8792B;
    --ink:#FBF6EA;
    --card:#ffffff;
    --paper:#241F16;
    --text-dim:#7A7260;
    --correct:#2ecc71;
    --wrong:#e74c3c;
    --timer-danger:#e74c3c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--ink);
    color:var(--paper);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
  }
  .zh{ font-family:'Noto Serif SC',serif; }
  .top-bar{
    width:100%;max-width:480px;
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .back-btn{
    background:none;border:none;font-size:22px;color:var(--paper);cursor:pointer;
  }
  .total-timer-wrap{
    width:100%;max-width:480px;
    background:#eee;border-radius:20px;height:10px;overflow:hidden;margin-bottom:18px;
  }
  .total-timer-bar{
    height:100%;background:var(--seal);border-radius:20px;
    transition:width 0.2s linear, background 0.3s;
    width:100%;
  }
  .score-row{
    width:100%;max-width:480px;
    display:flex;justify-content:space-between;
    font-size:14px;color:var(--text-dim);margin-bottom:14px;
  }
  .card{
    width:100%;max-width:480px;
    background:var(--card);
    border-radius:18px;
    padding:24px 18px;
    box-shadow:0 4px 18px rgba(36,31,22,0.08);
    text-align:center;
  }
  .q-timer-ring{
    width:56px;height:56px;margin:0 auto 14px;
    position:relative;
  }
  .q-timer-ring svg{transform:rotate(-90deg);width:56px;height:56px;}
  .q-timer-ring circle{ fill:none;stroke-width:5; }
  .q-timer-bg{stroke:#eee;}
  .q-timer-fg{
    stroke:var(--seal);
    stroke-linecap:round;
    transition:stroke-dashoffset 0.2s linear, stroke 0.3s;
  }
  .q-timer-num{
    position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:16px;
  }
  .question-text{
    font-family:'Noto Serif SC',serif;
    font-size:30px;font-weight:bold;margin-bottom:6px;
    min-height:34px;
  }
  .question-pinyin{
    font-size:14px; color:var(--text-dim); margin-bottom:10px; min-height:16px;
  }
  .speaker-btn{
    background:var(--card);border:2px solid var(--seal);border-radius:24px;
    font-size:15px;color:var(--seal);cursor:pointer;
    padding:8px 18px;margin-bottom:14px;opacity:0.95;transition:transform 0.15s;
  }
  .speaker-btn:active{transform:scale(0.95);}
  .speaker-btn.speaking{animation:pulseSpeaker 0.6s infinite;}
  @keyframes pulseSpeaker{ 0%,100%{opacity:0.95;} 50%{opacity:0.5;} }
  .question-text.audio-mode{ font-size:44px;margin-bottom:2px; }
  .question-sub{ font-size:14px;color:var(--text-dim);margin-bottom:20px; }
  .options{ display:grid;grid-template-columns:1fr 1fr;gap:10px; }
  .opt-btn{
    padding:16px 8px;border-radius:12px;border:2px solid #eee;
    background:#fff;font-size:15px;cursor:pointer;color:var(--paper);
    transition:all 0.15s; font-family:'Tajawal',sans-serif;
  }
  .opt-btn:active{transform:scale(0.97);}
  .opt-btn.correct{background:var(--correct);border-color:var(--correct);color:#fff;}
  .opt-btn.wrong{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .opt-btn.disabled{pointer-events:none;opacity:0.85;}
  .streak-badge{ display:inline-block;margin-top:14px;font-size:13px;color:var(--seal);font-weight:bold; }
  .result-screen{display:none;}
  .result-screen.show{display:block;}
  .result-emoji{font-size:56px;margin-bottom:10px;}
  .result-title{font-size:22px;font-weight:bold;margin-bottom:6px; font-family:'Amiri',serif;}
  .result-stats{ display:flex;justify-content:space-around;margin:20px 0; }
  .result-stat b{display:block;font-size:22px;color:var(--seal);}
  .result-stat span{font-size:12px;color:var(--text-dim);}
  .action-btn{
    display:block;width:100%;padding:14px;border:none;border-radius:12px;
    background:var(--seal);color:#fff;font-size:16px;font-weight:bold;
    margin-top:10px;cursor:pointer; font-family:'Tajawal',sans-serif;
  }
  .action-btn.secondary{background:#f1f1f1;color:var(--paper);}
  .hidden{display:none !important;}
  .empty-state{ text-align:center; padding:20px 10px; color:var(--text-dim); }
  .empty-state .action-btn{ margin-top:20px; }

  @keyframes shakeWrong{
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);} 80%{transform:translateX(6px);}
  }
  @keyframes pulseCorrect{ 0%{transform:scale(1);} 30%{transform:scale(1.04);} 100%{transform:scale(1);} }
  .card.shake-wrong{animation:shakeWrong 0.4s ease;}
  .card.pulse-correct{animation:pulseCorrect 0.35s ease;}
  .opt-btn.correct{animation:pulseCorrect 0.35s ease;}
  .opt-btn.wrong{animation:shakeWrong 0.4s ease;}
  .card.flash-correct{box-shadow:0 0 0 3px var(--correct), 0 4px 18px rgba(36,31,22,0.08);}
  .card.flash-wrong{box-shadow:0 0 0 3px var(--wrong), 0 4px 18px rgba(36,31,22,0.08);}
</style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="history.back()">→</button>
  <strong>اختبار الوقت ⏱️</strong>
  <span style="width:22px"></span>
</div>

<div class="total-timer-wrap">
  <div class="total-timer-bar" id="totalTimerBar"></div>
</div>

<div class="score-row">
  <span id="progressLabel">سؤال 1 / 10</span>
  <span id="scoreLabel">النقاط: 0</span>
</div>

<!-- شاشة السؤال -->
<div class="card" id="quizCard">
  <div class="q-timer-ring">
    <svg viewBox="0 0 56 56">
      <circle class="q-timer-bg" cx="28" cy="28" r="24"></circle>
      <circle class="q-timer-fg" id="qTimerFg" cx="28" cy="28" r="24"
              stroke-dasharray="150.8" stroke-dashoffset="0"></circle>
    </svg>
    <div class="q-timer-num" id="qTimerNum">10</div>
  </div>

  <div class="question-text zh" id="questionText"></div>
  <div class="question-pinyin" id="questionPinyin"></div>
  <button class="speaker-btn hidden" id="speakerBtn" title="اسمع تاني">🔊 اسمع تاني</button>
  <div class="question-sub" id="questionSub">اختار المعنى الصح</div>

  <div class="options" id="optionsGrid"></div>

  <div class="streak-badge hidden" id="streakBadge">🔥 سلسلة: 0</div>
</div>

<!-- شاشة مفيش كلمات كفاية -->
<div class="card empty-state hidden" id="emptyState">
  <div style="font-size:40px;margin-bottom:10px;">📚</div>
  <div style="font-weight:bold;font-size:17px;margin-bottom:8px;">لسه مفيش كلمات كفاية</div>
  <p>كمّل درسين على الأقل في المستوى ده الأول عشان يبقى فيه كلمات كفاية للاختبار.</p>
  <button class="action-btn" onclick="location.href='quiz-select.html'">رجوع لاختيار المستوى</button>
</div>

<!-- شاشة النتيجة -->
<div class="card result-screen" id="resultScreen">
  <div class="result-emoji" id="resultEmoji">🎉</div>
  <div class="result-title" id="resultTitle">أحسنت!</div>
  <div class="result-stats">
    <div class="result-stat"><b id="finalScore">0</b><span>نقطة</span></div>
    <div class="result-stat"><b id="finalCorrect">0/0</b><span>إجابات صح</span></div>
    <div class="result-stat"><b id="finalStreak">0</b><span>أعلى سلسلة</span></div>
  </div>
  <button class="action-btn" onclick="restartQuiz()">إعادة المحاولة</button>
  <button class="action-btn secondary" onclick="location.href='quiz-select.html'">رجوع لاختيار المستوى</button>
</div>

<script src="hsk1-data.js"></script>
<script src="hsk2-data.js"></script>
<script src="hsk3-data.js"></script>
<script src="progress.js"></script>

<script>
// ==========================================================================
// إعدادات الكويز
// ==========================================================================
const CONFIG = {
  TOTAL_TIME_SECONDS: 60,
  PER_QUESTION_SECONDS: 10,
  QUESTION_COUNT: 10,
  POINTS_PER_CORRECT: (window.TaallimProgress && TaallimProgress.POINTS_TABLE.quizCorrectAnswer) || 5,
  PERFECT_BONUS: (window.TaallimProgress && TaallimProgress.POINTS_TABLE.quizPerfectScore) || 15,
  STREAK_BONUS: 5
};

const LEVEL_NUM = parseInt(new URLSearchParams(location.search).get('level'), 10) || 1;
const LEVEL_LABEL = 'HSK' + LEVEL_NUM;
const LEVEL_LESSONS = { 1: (typeof HSK1_LESSONS !== 'undefined' ? HSK1_LESSONS : []),
                         2: (typeof HSK2_LESSONS !== 'undefined' ? HSK2_LESSONS : []),
                         3: (typeof HSK3_LESSONS !== 'undefined' ? HSK3_LESSONS : []) }[LEVEL_NUM] || [];

let questions = [];
let currentIndex = 0;
let score = 0;
let correctCount = 0;
let streak = 0;
let maxStreak = 0;
let totalTimeLeft = CONFIG.TOTAL_TIME_SECONDS;
let qTimeLeft = CONFIG.PER_QUESTION_SECONDS;
let totalTimerInterval = null;
let qTimerInterval = null;
let answered = false;

const Q_CIRCUMFERENCE = 150.8;

// ==========================================================================
// بناء بنك الكلمات: بس الكلمات اللي في الدروس المكتملة في المستوى ده
// ==========================================================================
function wordPoolForLevel() {
  const state = TaallimProgress.loadProgress();
  const lastDone = state.lastCompletedByLevel[LEVEL_LABEL] || 0;
  let words = [];
  LEVEL_LESSONS.forEach(lesson => {
    if (lesson.id <= lastDone) {
      lesson.words.forEach((w, idx) => {
        words.push({
          char: w.char,
          pinyin: w.pinyin,
          ar: w.ar,
          audio: `audio/hsk${LEVEL_NUM}/l${lesson.id}-${idx + 1}.wav`
        });
      });
    }
  });
  return words;
}

function buildQuestionSet() {
  const pool = wordPoolForLevel();
  if (pool.length < 4) return [];

  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(CONFIG.QUESTION_COUNT, shuffled.length));

  return selected.map(q => {
    const others = pool.filter(p => p.ar !== q.ar).map(p => p.ar);
    const wrongOptions = [...new Set(others)].sort(() => Math.random() - 0.5).slice(0, 3);
    const allOptions = [q.ar, ...wrongOptions].sort(() => Math.random() - 0.5);
    const type = Math.random() < 0.5 ? "text" : "audio";
    return { char: q.char, pinyin: q.pinyin, correct: q.ar, audio: q.audio, options: allOptions, type };
  });
}

// ==========================================================================
// منطق اللعبة
// ==========================================================================
function startQuiz() {
  questions = buildQuestionSet();

  if (!questions.length) {
    document.getElementById('quizCard').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('show');
    document.getElementById('emptyState').classList.remove('hidden');
    document.getElementById('totalTimerBar').parentElement.classList.add('hidden');
    return;
  }

  currentIndex = 0; score = 0; correctCount = 0; streak = 0; maxStreak = 0;
  totalTimeLeft = CONFIG.TOTAL_TIME_SECONDS;

  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizCard').classList.remove('hidden');

  startTotalTimer();
  showQuestion();
}

function startTotalTimer() {
  clearInterval(totalTimerInterval);
  updateTotalBar();
  totalTimerInterval = setInterval(() => {
    totalTimeLeft -= 0.2;
    if (totalTimeLeft <= 0) { totalTimeLeft = 0; updateTotalBar(); endQuiz(); return; }
    updateTotalBar();
  }, 200);
}

function updateTotalBar() {
  const pct = Math.max(0, (totalTimeLeft / CONFIG.TOTAL_TIME_SECONDS) * 100);
  const bar = document.getElementById("totalTimerBar");
  bar.style.width = pct + "%";
  bar.style.background = pct < 20 ? "var(--timer-danger)" : "var(--seal)";
}

function showQuestion() {
  if (currentIndex >= questions.length) { endQuiz(); return; }
  answered = false;
  qTimeLeft = CONFIG.PER_QUESTION_SECONDS;

  const q = questions[currentIndex];
  const textEl = document.getElementById("questionText");
  const pinyinEl = document.getElementById("questionPinyin");
  const speakerBtn = document.getElementById("speakerBtn");
  const subEl = document.getElementById("questionSub");

  speakerBtn.onclick = () => playWordAudio(q.audio, q.char);

  if (q.type === "audio") {
    textEl.textContent = "🔊";
    textEl.classList.add("audio-mode");
    pinyinEl.textContent = "";
    speakerBtn.classList.remove("hidden");
    subEl.textContent = "استمع واختار المعنى الصح";
    playWordAudio(q.audio, q.char);
  } else {
    textEl.textContent = q.char;
    textEl.classList.remove("audio-mode");
    pinyinEl.textContent = "";
    speakerBtn.classList.add("hidden");
    subEl.textContent = "اختار المعنى الصح";
  }

  document.getElementById("progressLabel").textContent = `سؤال ${currentIndex + 1} / ${questions.length}`;
  document.getElementById("scoreLabel").textContent = `النقاط: ${score}`;

  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";
  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(btn, opt, q.correct);
    grid.appendChild(btn);
  });

  startQuestionTimer();
}

function startQuestionTimer() {
  clearInterval(qTimerInterval);
  updateQRing();
  qTimerInterval = setInterval(() => {
    qTimeLeft -= 0.2;
    if (qTimeLeft <= 0) {
      qTimeLeft = 0; updateQRing();
      handleAnswer(null, null, questions[currentIndex].correct);
      return;
    }
    updateQRing();
  }, 200);
}

function updateQRing() {
  const pct = qTimeLeft / CONFIG.PER_QUESTION_SECONDS;
  const offset = Q_CIRCUMFERENCE * (1 - pct);
  const fg = document.getElementById("qTimerFg");
  fg.style.strokeDashoffset = offset;
  fg.style.stroke = pct < 0.3 ? "var(--timer-danger)" : "var(--seal)";
  document.getElementById("qTimerNum").textContent = Math.ceil(qTimeLeft);
}

function handleAnswer(btnEl, chosen, correctAnswer) {
  if (answered) return;
  answered = true;
  clearInterval(qTimerInterval);

  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach(b => {
    b.classList.add("disabled");
    if (b.textContent === correctAnswer) b.classList.add("correct");
  });
  if (btnEl && chosen !== correctAnswer) btnEl.classList.add("wrong");

  const card = document.getElementById("quizCard");
  const isCorrect = chosen === correctAnswer;
  card.classList.remove("pulse-correct", "shake-wrong", "flash-correct", "flash-wrong");
  void card.offsetWidth;
  card.classList.add(isCorrect ? "pulse-correct" : "shake-wrong");
  card.classList.add(isCorrect ? "flash-correct" : "flash-wrong");
  setTimeout(() => card.classList.remove("flash-correct", "flash-wrong"), 600);

  if (isCorrect) {
    correctCount++; streak++; maxStreak = Math.max(maxStreak, streak);
    let points = CONFIG.POINTS_PER_CORRECT;
    if (streak > 0 && streak % 3 === 0) points += CONFIG.STREAK_BONUS;
    score += points;

    const badge = document.getElementById("streakBadge");
    if (streak >= 2) { badge.textContent = `🔥 سلسلة: ${streak}`; badge.classList.remove("hidden"); }
  } else {
    streak = 0;
    document.getElementById("streakBadge").classList.add("hidden");
  }

  document.getElementById("scoreLabel").textContent = `النقاط: ${score}`;
  setTimeout(() => { currentIndex++; showQuestion(); }, 900);
}

function endQuiz() {
  clearInterval(totalTimerInterval);
  clearInterval(qTimerInterval);

  document.getElementById("quizCard").classList.add("hidden");
  const result = document.getElementById("resultScreen");
  result.classList.add("show");

  const total = Math.max(currentIndex, 1);
  const pct = correctCount / total;
  document.getElementById("resultEmoji").textContent = pct >= 0.8 ? "🏆" : pct >= 0.5 ? "🎉" : "💪";
  document.getElementById("resultTitle").textContent = pct >= 0.8 ? "ممتاز!" : pct >= 0.5 ? "أحسنت!" : "شد حيلك المرة الجاية";
  document.getElementById("finalScore").textContent = score;
  document.getElementById("finalCorrect").textContent = `${correctCount}/${currentIndex}`;
  document.getElementById("finalStreak").textContent = maxStreak;

  // ==========================================================================
  // حفظ النقط في نفس نظام taallim_chinese_progress بتاع التطبيق
  // ==========================================================================
  try {
    let finalScore = score;
    if (currentIndex > 0 && correctCount === currentIndex) finalScore += CONFIG.PERFECT_BONUS;
    const state = TaallimProgress.loadProgress();
    state.points += finalScore;
    TaallimProgress.saveProgress(state);
  } catch (e) {
    console.warn("تعذّر حفظ نقط اختبار الوقت:", e);
  }
}

function restartQuiz() { startQuiz(); }

// ==========================================================================
// تشغيل النطق: نفس منطق التطبيق الرئيسي — ملف صوت مسجّل، ولو مش موجود
// يرجع لـ Web Speech API بصوت صيني (zh-CN)
// ==========================================================================
function playWordAudio(audioPath, fallbackChar) {
  const btn = document.getElementById("speakerBtn");
  if (btn) btn.classList.add("speaking");
  const doneSpeaking = () => { if (btn) btn.classList.remove("speaking"); };

  if (audioPath) {
    const audio = new Audio(audioPath);
    audio.onended = doneSpeaking;
    audio.onerror = () => speakChinese(fallbackChar, doneSpeaking);
    audio.play().catch(() => speakChinese(fallbackChar, doneSpeaking));
    return;
  }
  speakChinese(fallbackChar, doneSpeaking);
}

let zhVoice = null;
let voicesReady = false;
function loadZhVoice() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length) {
    zhVoice = voices.find(v => v.lang === 'zh-CN') || voices.find(v => v.lang && v.lang.startsWith('zh')) || null;
    voicesReady = true;
  }
}
if ('speechSynthesis' in window) { loadZhVoice(); window.speechSynthesis.onvoiceschanged = loadZhVoice; }

function speakChinese(text, onEnd) {
  if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
    window.AppInventor.setWebViewString('SPEAK_ZH::' + text);
    if (onEnd) onEnd();
    return;
  }
  if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
  if (!voicesReady) { loadZhVoice(); if (!voicesReady) { setTimeout(() => speakChinese(text, onEnd), 300); return; } }
  if (!zhVoice) { if (onEnd) onEnd(); return; }
  const utter = new SpeechSynthesisUtterance(text);
  utter.voice = zhVoice; utter.lang = 'zh-CN'; utter.rate = 0.8;
  utter.onend = onEnd; utter.onerror = onEnd;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

startQuiz();
</script>

</body>
</html>
